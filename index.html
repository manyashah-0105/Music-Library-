<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="side">
  <div class="logo">MS</div>
  <p class="lbl">YOUR LIBRARY</p>
  <nav id="nav">
    <button data-v="all" class="on"><i data-i="note"></i><span>All Tracks</span></button>
    <button data-v="list"><i data-i="circleplay"></i><span>Manya ‘s Playlist</span><b>5</b></button>
    <button data-v="liked"><i data-i="heart"></i><span>Liked Songs</span></button>
    <button data-v="now"><i data-i="tri"></i><span>Now Playing</span></button>
  </nav>
  <div class="sbot">
    <div class="eqbox"><span>Sound EQ</span><em>Flat</em></div>
    <button class="plain"><i data-i="gear"></i><span>Settings</span></button>
    <div class="store"><small>LIBRARY STORAGE</small><div class="meter"></div><small class="idx">5 tracks indexed</small></div>
  </div>
</aside>

<main>
  <header class="top">
    <label class="search"><i data-i="search"></i><input id="q" type="search" placeholder="Search your library..."></label>
    <div class="topr">
      <button class="chip"><i data-i="eq"></i>EQ: Flat</button>
      <button class="chip" id="timer"><i data-i="clock"></i><span id="timerT">Timer</span></button>
      <button class="icon" id="theme" aria-label="Switch dark / light mode"></button>
      <button class="avatar">MS</button>
    </div>
  </header>

  <section id="lib" class="wrap">
    <div class="head">
      <div><p class="eyebrow">COLLECTION / 2026</p><h1 id="ttl">All</h1><p class="sub" id="sub">5 tracks in this album</p></div>
      <button class="icon round"><i data-i="dots"></i></button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="actions">
      <div><button class="btn pri"><i data-i="upload"></i>Scan folder</button>
      <button class="btn" id="shufBtn"><i data-i="shuffle"></i>Shuffle</button>
      <button class="btn"><i data-i="download"></i>Save for offline drive</button></div>
      <span class="count" id="count">5 tracks</span>
    </div>
    <div id="list"></div>
  </section>

  <section id="now" class="wrap now hidden">
    <div class="nhead">
      <button class="icon round" id="back" aria-label="Back to library"><i data-i="prev"></i></button>
      <span class="eyebrow">NOW PLAYING</span>
      <div><button class="icon round" id="share" aria-label="Share song"><i data-i="share"></i></button>
      <button class="icon round likebtn" aria-label="Like song"><i data-i="heart"></i></button></div>
    </div>
    <div class="ngrid">
      <div class="vinylwrap"><div class="halo"></div><div class="vinyl" id="vinyl"><div class="groove"></div><div class="disc"><i data-i="note"></i></div></div></div>
      <div class="meta">
        <p class="eyebrow">LISTENING NOW</p>
        <h2 id="nTitle">Kesariya</h2>
        <p class="album" id="nAlbum"></p>
        <p class="tags" id="nTags"></p>
        <p class="lyrics">♪ Lyrics not available for this track.</p>
        <div class="seekrow"><input class="seek" type="range" min="0" max="1000" value="0" aria-label="Track progress">
          <div class="times"><span class="tcur">0:00</span><span class="trem">-0:00</span></div></div>
        <div class="ctrl big">
          <button class="shufbtn" aria-label="Shuffle"><i data-i="shuffle"></i></button>
          <button class="prevbtn" aria-label="Previous">‹</button>
          <button class="ppbtn" aria-label="Play or pause"></button>
          <button class="nextbtn" aria-label="Next">›</button>
          <button class="repbtn" aria-label="Repeat"><i data-i="repeat"></i></button>
        </div>
        <div class="tools">
          <div class="volbox"><button class="mute" aria-label="Mute"></button><input class="vol" type="range" min="0" max="100" value="100" aria-label="Volume"></div>
          <button class="pill speed">1.0x</button><button class="pill">Flat EQ</button>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="bar" id="bar">
  <div class="binfo"><div class="bthumb"><i data-i="note"></i></div>
    <div class="btext"><strong id="bTitle">Select a song</strong><small id="bCat">Hindi</small></div>
    <button class="icon likebtn" aria-label="Like current song"><i data-i="heart"></i></button></div>
  <div class="bmid">
    <div class="ctrl">
      <button class="shufbtn" aria-label="Shuffle"><i data-i="shuffle"></i></button>
      <button class="prevbtn" aria-label="Previous">‹</button>
      <button class="ppbtn" aria-label="Play or pause"></button>
      <button class="nextbtn" aria-label="Next">›</button>
      <button class="repbtn" aria-label="Repeat"><i data-i="repeat"></i></button>
    </div>
    <div class="seekline"><span class="tcur">0:00</span><input class="seek" type="range" min="0" max="1000" value="0" aria-label="Track progress"><span class="trem">-0:00</span></div>
  </div>
  <div class="bright">
    <button class="icon" id="openNow" aria-label="Open Now Playing"><i data-i="eq"></i></button>
    <button class="icon"><i data-i="clock"></i></button>
    <button class="icon mute" aria-label="Mute"></button><input class="vol" type="range" min="0" max="100" value="100" aria-label="Volume">
    <button class="icon" id="full"><i data-i="expand"></i></button>
  </div>
</footer>

<div id="toast" class="toast"></div>
<audio id="au" preload="metadata"></audio>
<script src="songs.js"></script>
<script src="script.js"></script>
</body>
</html>
